      ]
    }
  ]
};

// ─── Layout ─────────────────────────────────────────────
const width = 2800;
const height = 2600;

const svg = d3.select("#svg-container")
  .append("svg")
  .attr("width", width)
  .attr("height", height)
  .style("cursor", "grab");

const g = svg.append("g").attr("transform", "translate(320,60)");

let zoomScale = 1;
const zoom = d3.zoom()
  .scaleExtent([0.25, 3.5])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
    zoomScale = event.transform.k;
    document.getElementById("zoomLevel").textContent = Math.round(zoomScale * 100) + "%";
  });

svg.call(zoom);

window.zoomIn = () => { svg.transition().duration(300).call(zoom.scaleBy, 1.3); };
window.zoomOut = () => { svg.transition().duration(300).call(zoom.scaleBy, 0.7); };
window.resetView = () => { svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(320,60).scale(1)); };

const treeLayout = d3.tree().nodeSize([34, 240]).separation((a,b) => (a.parent===b.parent ? 1 : 1.2));
const root = d3.hierarchy(data);
root.x0 = 0; root.y0 = 0;

function getNodeColor(d) {
  if (d.data.color) return d.data.color;
  const n = (d.data.name || "").toLowerCase();
  if (n.includes("domain")||n.includes("model")||n.includes("repository")) return "#e74c3c";
  if (n.includes("data")||n.includes("audio")||n.includes("remote")||n.includes("settings")) return "#3498db";
  if (n.includes("presentation")||n.includes("viewmodel")||n.includes("compose")||n.includes("theme")) return "#2ecc71";
  if (n.includes("di")||n.includes("utils")||n.includes("构建")||n.includes("android")||n.includes("res/")||n.includes("assets")) return "#f39c12";
  if (n.includes("mcp")||n.includes("工具")||n.includes("原生")||n.includes("c++")||n.includes("jni")) return "#9b59b6";
  if (n.includes("协议")||n.includes("网络")||n.includes("websocket")) return "#1abc9c";
  if (n.includes("架构")||n.includes("评估")||n.includes("p0")||n.includes("p1")) return "#e67e22";
  return "#666";
}

function getIcon(d) {
  const n = (d.data.name || "").toLowerCase();
  if (d.depth===0) return "📱";
  if (d.depth===1) {
    if (n.includes("domain")) return "🎯";
    if (n.includes("data")) return "⚙️";
    if (n.includes("presentation")) return "🖥️";
    if (n.includes("di")||n.includes("utils")) return "🔗";
    if (n.includes("原生")||n.includes("c++")) return "⚡";
    if (n.includes("android")) return "📱";
    if (n.includes("协议")) return "🔌";
    if (n.includes("mcp")) return "📊";
    if (n.includes("架构")) return "🎯";
    return "📦";
  }
  if (d.depth===2) {
    if (n.includes("model")) return "📦";
    if (n.includes("repository")) return "📋";
    if (n.includes("audio")) return "🔊";
    if (n.includes("remote")) return "🌐";
    if (n.includes("mcp")||n.includes("工具")) return "🔧";
    if (n.includes("viewmodel")) return "📄";
    if (n.includes("compose")||n.includes("ui/")) return "🖥️";
    if (n.includes("theme")) return "🎨";
    if (n.includes("settings")) return "⚙️";
    if (n.includes("manifest")) return "📋";
    if (n.includes("权限")) return "🔐";
    if (n.includes("gradle")||n.includes("构建")) return "🏗️";
    if (n.includes("res/")||n.includes("资源")) return "🎨";
    if (n.includes("assets")) return "🗄️";
    if (n.includes("文档")||n.includes("根目录")) return "📄";
    return "📄";
  }
  return "•";
}

function update(source) {
  const treeData = treeLayout(root);
  const nodes = treeData.descendants();
  const links = treeData.links();
  nodes.forEach(d => { d.y = d.depth * 240; });

  const link = g.selectAll("path.link")
    .data(links, d => d.target.data.name);
  link.exit().transition().duration(300).attr("stroke-opacity",0).remove();
  const linkEnter = link.enter().append("path")
    .attr("class","link").attr("fill","none")
    .attr("stroke",d=>d3.color(getNodeColor(d.target)).formatHex())
    .attr("stroke-opacity",0.25).attr("stroke-width",1.5)
    .attr("d",d=>{const o={x:source.x0,y:source.y0};return diag(o,o);});
  link.merge(linkEnter).transition().duration(500)
    .attr("stroke-opacity",0.25).attr("d",d=>diag(d.source,d.target));

  const node = g.selectAll("g.node")
    .data(nodes, d => d.data.name);
  node.exit().transition().duration(300).attr("opacity",0).remove();
  const nodeEnter = node.enter().append("g")
    .attr("class","node-group")
    .attr("transform",d=>`translate(${source.y0},${source.x0})`)
    .on("click",(event,d)=>{if(d.children||d._children) toggle(d);});

  nodeEnter.append("rect").attr("class","node-bg")
    .attr("rx",d=>d.depth===0?10:d.depth===1?8:6)
    .attr("ry",d=>d.depth===0?10:d.depth===1?8:6)
    .attr("fill",d=>d.depth===0?"#1a1a24":getBgColor(d))
    .attr("stroke",d=>d.depth===0?"#444":getBorderColor(d))
    .attr("stroke-width",d=>d.depth===0?2:1).attr("stroke-opacity",0.6);

  nodeEnter.append("text").attr("class","collapse-indicator")
    .attr("text-anchor","middle").attr("font-size",11).attr("fill","#888")
    .attr("x",d=>tw(d)+16).text(d=>d.children?"−":(d._children?"+":""));

  nodeEnter.append("text").attr("class","node-icon")
    .attr("text-anchor","middle")
    .attr("font-size",d=>d.depth===0?18:d.depth===1?14:12).attr("x",-20).text(d=>getIcon(d));

  nodeEnter.append("text").attr("class","node-text")
    .attr("dy",4)
    .attr("font-size",d=>d.depth===0?15:d.depth===1?13:d.depth===2?11.5:11)
    .attr("fill",d=>d.depth===0?"#fff":getTextColor(d))
    .attr("font-weight",d=>d.depth<=1?600:400)
    .text(d=>trunc(d.data.name,d.depth===0?35:d.depth===1?30:28));

  const nodeMerge = nodeEnter.merge(node);
  nodeMerge.transition().duration(500).attr("transform",d=>`translate(${d.y},${d.x})`);
  nodeMerge.select("rect")
    .attr("width",d=>tw(d)+44).attr("height",d=>d.depth===0?36:30)
    .attr("x",d=>-(tw(d)+34)/2).attr("y",d=>d.depth===0?-18:-15);
  nodeMerge.select(".collapse-indicator")
    .text(d=>d.children?"−":(d._children?"+":"")).attr("x",d=>(tw(d)+44)/2+4);

  nodes.forEach(d=>{d.x0=d.x;d.y0=d.y;});
}

function diag(s,t) {
  const dx=t.x-s.x, dy=t.y-s.y, midY=s.y+dy*0.5;
  return `M${s.y},${s.x}C${midY},${s.x} ${midY},${t.x} ${t.y},${t.x}`;
}

function tw(d) {
  const len = trunc(d.data.name, d.depth===0?35:d.depth===1?30:28).length;
  return Math.max(len*(d.depth===0?8.5:d.depth===1?7:6.5),30);
}

function trunc(str, max) {
  if (!str) return "";
  return str.length > max ? str.substring(0, max-1) + "…" : str;
}

function getBgColor(d) {
  const c = getNodeColor(d);
  const col = d3.color(c);
  col.opacity = 0.12;
  return col.formatHex();
}

function getBorderColor(d) {
  const c = getNodeColor(d);
  return d3.color(c).darker(0.5).formatHex();
}

function getTextColor(d) {
  const c = getNodeColor(d);
  return d3.color(c).brighter(0.5).formatHex();
}

function toggle(d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else { d.children = d._children; d._children = null; }
  update(d);
}

window.collapseAll = () => {
  root.descendants().forEach((d,i)=>{if(i>0&&d.children){d._children=d.children;d.children=null;}});
  update(root);
};
window.expandAll = () => {
  root.descendants().forEach(d=>{if(d._children){d.children=d._children;d._children=null;}});
  update(root);
};

// Initial expand to depth 2
root.descendants().forEach((d,i)=>{
  if(d.depth>=2&&d.children){d._children=d.children;if(d.depth>=3)d.children=null;}
});
update(root);
</script>
</body>
